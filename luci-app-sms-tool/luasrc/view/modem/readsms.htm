<h2><%:短信%></h2>
<p>收到的短信保存到路由器，确认保存成功后自动释放 SIM 或模组短信空间。关闭浏览器后仍会收件。</p>
<p id="smsStatus" role="status" aria-live="polite">正在读取短信…</p>
<p id="smsCapacity">正在检查存储空间…</p>
<p id="smsMergeStatus"></p>

<table class="table" style="width:100%">
    <thead><tr class="tr cbi-rowstyle-2">
        <th style="width:7%"><input type="checkbox" id="smsSelectAll" aria-label="选择全部已归档短信" /></th>
        <th style="width:15%"><%:来自%></th>
        <th style="width:20%"><%:收到%></th>
        <th><%:信息%></th>
    </tr></thead>
    <tbody id="smsMessages"></tbody>
</table>
<div class="cbi-page-actions">
    <button type="button" class="btn cbi-button cbi-button-neutral" id="smsRefresh">立即刷新</button>
    <button type="button" class="btn cbi-button cbi-button-neutral" id="smsDelete">删除所选本地记录</button>
</div>

<script src="<%=resource%>/sms-tool-inbox.js"></script>
<script src="<%=resource%>/sms-tool-inbox-view.js"></script>
<script>
window.addEventListener('load', function() {
    SMSInboxView.mount({
        readUrl: '<%=luci.dispatcher.build_url("admin", "network", "modem", "sms", "get_inbox")%>',
        deleteUrl: '<%=luci.dispatcher.build_url("admin", "network", "modem", "sms", "delete_saved")%>',
        token: '<%=token%>'
    });
});
</script>

<%+footer%>
